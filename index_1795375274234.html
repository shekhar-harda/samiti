function mkpw(){const m=$("lm").value.trim(),a=$("n1").value,b=$("n2").value;if(!/^\d{10}$/.test(m)){msg=t("bad");return draw()}if(a.length<6){msg=t("short");return draw()}if(a!==b){msg=t("mis");return draw()}auth.createUserWithEmailAndPassword(m+"@samiti.app",a).then(()=>db.collection("secrets").doc(m).set({pw:a}).catch(()=>{})).catch(e=>{msg=e.code=="auth/email-already-in-use"?t("exists"):t("bad2");draw()})}

function chMob(){const id=+$("cm").value,n=$("nm").value.trim(),m=S.m.find(x=>x.id==id);if(!/^\d{10}$/.test(n)||S.m.some(x=>x.mob==n)){msg=t("bad");return draw()}if(m.role=="सचिव"){msg=t("nosec");return draw()}log(`मोबाइल बदला / Mobile changed: ${m.name} ${m.mob} → ${n}`);m.mob=n;msg=t("dsave");save();draw()}
auth.onAuthStateChanged(u=>{if(unsub){unsub();unsub=null}if(!u){me=null;S=null;PW={};INV={};CL={};claimNeeded=false;window.ls=0;tab="home";draw();return}
const m=u.email.split("@")[0];claimNeeded=false;
unsub=ref.onSnapshot(sn=>{if(!sn.exists){msg=t("wait");auth.signOut();return}
S=sn.data();me=S.m.find(x=>x.mob==m)||null;su=false;claimNeeded=false;
if(isSec()&&!window.syn){window.syn=1;db.doc("samiti/allowed").set({mobiles:S.m.map(x=>x.mob)})}
if(isSec()&&!window.ls){window.ls=1;loadSec()}
draw()},e=>{if(e.code=="permission-denied"){me=null;S=null;claimNeeded=true;msg="";draw()}else{msg=e.code;auth.signOut()}})});
draw();
</script>
