function trw(w){const U=[];let cl=false;const A=[...w];
 for(let i=0;i<A.length;i++){const ch=A[i];
  if(TC[ch]){const u={c:TC[ch],v:"a",inh:true,cl,t:""};cl=false;const nx=A[i+1];if(TM[nx]){u.v=TM[nx];u.inh=false;i++}else if(nx=="्"){u.v="";u.inh=false;cl=true;i++}U.push(u)}
  else if(TV[ch]){U.push({c:"",v:TV[ch],inh:false,cl:false,t:""})}
  else if(ch=="ं"||ch=="ँ"){if(U.length)U[U.length-1].t="n"}
  else if(ch=="ः"){if(U.length)U[U.length-1].t="h"}
  else if(ch=="़"){}
  else U.push({c:ch,v:"",inh:false,cl:false,t:"",raw:true})}
 const n=U.length,keepF=u=>u.cl&&"ryl".includes(u.c)||"v"==u.c&&u.cl;
 const rem=(u,k)=>u.inh?(k==n-1?(n==1||keepF(u)):true):u.v!=="";
 for(let k=0;k<n;k++){const u=U[k];if(!u.inh)continue;
  if(k==n-1){if(n>1&&!(u.cl&&"rylv".includes(u.c))&&!u.t)u.v=""}
  else if(k>0&&!u.cl&&!u.t&&U[k-1].v!==""&&rem(U[k+1],k+1))u.v=""}
 return U.map((u,k)=>{let c=u.c;if(u.cl&&c=="v")c="w";let t=u.t;if(t=="n"){const nx=U[k+1];if(nx&&/^(p|b|m)/.test(nx.c))t="m"}return c+u.v+t}).join("")}

const mdiff=(d,p)=>{const a=new Date(d),b=new Date(p);let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(b.getDate()>a.getDate())m++;return Math.min(6,Math.max(1,m))};const addM=(d,n)=>{const x=new Date(d);x.setMonth(x.getMonth()+n);return x.toISOString().slice(0,10)};
function calc(a,d,paid,nr,pys,rm){a=+a;const due=addM(d,6),mm=paid?mdiff(d,paid):6,i=a*.03*mm,r=slab(a),rw=a*r/100*mm;let lm=0,lf=0;
 const p=paid||null;if(p&&p>due){lm=Math.ceil((new Date(p)-new Date(due))/864e5/30);for(let k=0;k<lm;k++){const st=new Date(new Date(due).getTime()+k*30*864e5).toISOString().slice(0,10);const pd2=(pys||[]).filter(x=>x.date<=st).reduce((z,x)=>z+ +x.amt,0);lf+=Math.max(0,a+i-pd2)*.03}}
 const rwd=(rm!=null&&rm!=="")?+rm:((lm||nr)?0:rw);return{i,r,rw:rwd,due,lm,lf,mm,tot:a+i+lf,net:i+lf-rwd}}
function stats(){const dep=S.d.reduce((s,x)=>s+ +x.amt,0);let out=0,ii=0;
 let po=0;S.l.forEach(l=>{const ps=(l.pays||[]).reduce((z,x)=>z+ +x.amt,0);if(l.pd){const c=calc(l.amt,l.date,l.pd,l.nr,l.pays,l.rm);ii+=c.net}else{out+=+l.amt;po+=ps}});
